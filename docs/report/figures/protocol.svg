<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img" aria-label="Durable operation protocol"><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica"><rect x="15" y="10" width="970" height="75" rx="10" fill="#EEF9F3" stroke="#237D68" stroke-width="2"/><text x="31" y="40" font-size="25" font-weight="bold" fill="#182B29" text-anchor="start">1  Persist immutable proposal</text><text x="31" y="69" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">UID + type + record + stable operation ID</text><rect x="15" y="125" width="970" height="75" rx="10" fill="#EEF9F3" stroke="#237D68" stroke-width="2"/><text x="31" y="155" font-size="25" font-weight="bold" fill="#182B29" text-anchor="start">2  Reconcile accepted proof first</text><text x="31" y="184" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Matching proof acknowledges exactly once before mutable-state checks</text><rect x="15" y="245" width="470" height="115" rx="10" fill="#EEF9F3" stroke="#237D68" stroke-width="2"/><text x="31" y="275" font-size="25" font-weight="bold" fill="#182B29" text-anchor="start">3a  Matching proof: acknowledge</text><text x="31" y="304" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Local cleanup is separate bookkeeping</text><text x="31" y="331" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Cleanup failure cannot repeat money</text><rect x="515" y="245" width="470" height="115" rx="10" fill="#EEF9F3" stroke="#237D68" stroke-width="2"/><text x="531" y="275" font-size="25" font-weight="bold" fill="#182B29" text-anchor="start">3b  No proof: original atomic attempt</text><text x="531" y="304" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Expected version; immutable payload</text><text x="531" y="331" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Business mutation and proof together</text><rect x="15" y="410" width="470" height="115" rx="10" fill="#EEF9F3" stroke="#237D68" stroke-width="2"/><text x="31" y="440" font-size="25" font-weight="bold" fill="#182B29" text-anchor="start">4a  Uncertain: retain and reconcile</text><text x="31" y="469" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Timeout / access error is not rejection</text><text x="31" y="496" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">An earlier Task may still commit</text><rect x="515" y="410" width="470" height="115" rx="10" fill="#EEF9F3" stroke="#237D68" stroke-width="2"/><text x="531" y="440" font-size="25" font-weight="bold" fill="#182B29" text-anchor="start">4b  Resolve before replacement</text><text x="531" y="469" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">Receipt wins, or authoritative fence</text><text x="531" y="496" font-size="22" font-weight="normal" fill="#182B29" text-anchor="start">prevents old commit before correction</text><path d="M500,85 L500,125" stroke="#506560" stroke-width="2.5" fill="none"/><polygon points="500,125 505.0,114.0 495.0,114.0" fill="#506560"/><path d="M350,200 L250,245" stroke="#506560" stroke-width="2.5" fill="none"/><polygon points="250,245 262.0829599435702,245.04559607525874 257.9793131702822,235.9263810235077" fill="#506560"/><path d="M650,200 L750,245" stroke="#506560" stroke-width="2.5" fill="none"/><polygon points="750,245 742.0206868297178,235.9263810235077 737.9170400564299,245.04559607525874" fill="#506560"/><path d="M650,360 L250,410" stroke="#506560" stroke-width="2.5" fill="none"/><polygon points="250,410 261.5352303167964,413.5970073030871 260.29488297090427,403.67422853595036" fill="#506560"/><path d="M485,465 L515,465" stroke="#506560" stroke-width="2.5" fill="none"/><polygon points="515,465 504.0,460.0 504.0,470.0" fill="#506560"/></g></svg>