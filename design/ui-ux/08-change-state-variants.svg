<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1200" viewBox="0 0 1030 1200" role="img" aria-labelledby="title desc">
<title id="title">08 / Pending, unknown and rejected edit variants</title><desc id="desc">Original static wireframe, fictional LKR examples. Numbered annotations explain proposed interaction. No production app or financial data.</desc>
<rect width="100%" height="100%" fill="#F4F7F6"/><g font-family="Arial, sans-serif"><text x="36" y="40" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">08 / Pending, unknown and rejected edit variants</text><text x="36" y="66" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Fictional sample data / static design / 4 November 2026</text>
<g transform="translate(36,96)"><rect x="-1" y="-1" width="392" height="1022" rx="21" fill="none" stroke="#82978D"/><rect x="0" y="0" width="390" height="1020" rx="20" fill="#F4F7F6"/><text x="24" y="31" font-size="11" fill="#506560" font-weight="600" text-anchor="start">CLARITY / DESIGN PROPOSAL</text><text x="24" y="66" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">Back  /  Saved expense change</text><path d="M24 84h342" stroke="#82978D" stroke-opacity=".4"/><rect x="24" y="110" width="342" height="152" rx="16" fill="#FFFFFF"/><text x="44" y="144" font-size="17" fill="#182B29" font-weight="600" text-anchor="start">Confirmed expense</text><text x="44" y="185" font-size="28" fill="#182B29" font-weight="600" text-anchor="start">LKR 750.00</text><text x="44" y="223" font-size="16" fill="#506560" font-weight="400" text-anchor="start">4 Nov / Food &amp; dining</text><rect x="24" y="286" width="342" height="182" rx="16" fill="#FFF3D6"/><text x="44" y="321" font-size="17" fill="#765610" font-weight="600" text-anchor="start">Edit waiting for confirmation</text><text x="44" y="356" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Proposed amount: LKR 900.00</text><text x="44" y="389" font-size="14" fill="#765610" font-weight="400" text-anchor="start">The original 750 remains in totals.</text><text x="44" y="412" font-size="14" fill="#765610" font-weight="400" text-anchor="start">The proposed change is saved unchanged.</text><circle cx="353" cy="299" r="12" fill="#182B29"/><text x="353" y="303" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><rect x="24" y="492" width="342" height="188" rx="16" fill="#FFFFFF"/><text x="44" y="526" font-size="17" fill="#182B29" font-weight="600" text-anchor="start">If confirmation is unknown</text><text x="44" y="560" font-size="14" fill="#506560" font-weight="400" text-anchor="start">It may already have reached the server.</text><text x="44" y="584" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Check the saved change before trying again.</text><text x="44" y="608" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Keep the same saved identity and details.</text><text x="44" y="632" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Safe withdrawal may need an online check.</text><circle cx="353" cy="505" r="12" fill="#182B29"/><text x="353" y="509" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><rect x="24" y="704" width="342" height="180" rx="16" fill="#FFFFFF"/><text x="44" y="738" font-size="17" fill="#A83732" font-weight="600" text-anchor="start">If rejection is established</text><text x="44" y="773" font-size="14" fill="#506560" font-weight="400" text-anchor="start">The change was not applied.</text><text x="44" y="797" font-size="14" fill="#506560" font-weight="400" text-anchor="start">The confirmed 750 remains in totals.</text><text x="44" y="821" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Only then offer the existing dismissal action.</text><circle cx="353" cy="718" r="12" fill="#182B29"/><text x="353" y="722" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="24" y="940" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Variants above are alternatives, not simultaneous states.</text></g>
<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Original contribution is retained</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A pending edit of 750 to 900 does not change totals.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A pending deletion likewise keeps the original.</text><circle cx="512" cy="265" r="12" fill="#182B29"/><text x="512" y="269" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="271" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Unknown is not failed</text><text x="540" y="300" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A timeout or later access error is not rejection proof.</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Do not relabel the protocol or add a discard shortcut.</text><circle cx="512" cy="381" r="12" fill="#182B29"/><text x="512" y="385" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="387" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Success is derived, not permanent</text><text x="540" y="416" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Matching receipt removes only this operation message.</text><text x="540" y="440" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Another unresolved operation remains visible.</text><text x="540" y="464" font-size="16" fill="#506560" font-weight="400" text-anchor="start">On account change, clear old-user records and copy.</text><text x="36" y="1172" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
</g></svg>