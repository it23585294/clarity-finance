ceries</text><text x="346" y="821" font-size="18" fill="#182B29" font-weight="600" text-anchor="end">6,500.00</text><text x="40" y="846" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Food &amp; dining / Committed</text><text x="40" y="869" font-size="14" fill="#166553" font-weight="600" text-anchor="start">Inspect expense</text><text x="24" y="916" font-size="12" fill="#506560" font-weight="600" text-anchor="start">1 NOVEMBER</text><rect x="24" y="930" width="342" height="99" rx="16" fill="#FFFFFF"/><text x="40" y="960" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Rent</text><text x="346" y="960" font-size="18" fill="#182B29" font-weight="600" text-anchor="end">34,000.00</text><text x="40" y="985" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Housing / Committed</text><text x="40" y="1008" font-size="14" fill="#166553" font-weight="600" text-anchor="start">Inspect expense</text><circle cx="353" cy="514" r="12" fill="#182B29"/><text x="353" y="518" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="24" y="1076" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Crypto has its own separate history in More.</text><rect x="0" y="1097" width="390" height="76" rx="0" fill="#FFFFFF"/><path d="M0 1097h390" stroke="#82978D" stroke-opacity=".4"/><path d="M40.75 1121l8-7 8 7v8h-6v-7h-4v7h-6z" fill="none" stroke="#506560" stroke-width="1.7"/><text x="48.75" y="1154" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">Overview</text><rect x="120.25" y="1104" width="52" height="28" rx="14" fill="#E3F1EA"/><path d="M138.25 1116h16m-16 6h16m-16 6h16" stroke="#166553" stroke-width="1.7"/><text x="146.25" y="1154" font-size="14" fill="#166553" font-weight="600" text-anchor="middle">History</text><rect x="234.75" y="1115" width="18" height="16" rx="2" fill="none" stroke="#506560" stroke-width="1.7"/><path d="M234.75 1120h18m-13-8v6m8-6v6" stroke="#506