<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Follow the actual transactions</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">The confirmed lunch now increases expenses by 750.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Income is a distinct history tab, not a mixed net.</text><circle cx="512" cy="265" r="12" fill="#182B29"/><text x="512" y="269" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="271" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Drill down without losing the month</text><text x="540" y="300" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Choose Food &amp; dining: 7,250.00, two rows.</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Clear the filter to return to all 45,750.00.</text><text x="540" y="348" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Month/category survive inspection and Back.</text><circle cx="512" cy="405" r="12" fill="#182B29"/><text x="512" y="409" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="411" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Rows are generous, labelled targets</text><text x="540" y="440" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Date groups and amounts are easy to scan.</text><text x="540" y="464" font-size="16" fill="#506560" font-weight="400" text-anchor="start">No swipe-only destructive actions.</text><text x="540" y="488" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Long names wrap; amount can move to next line.</text><text x="36" y="1325" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
