<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1225" viewBox="0 0 1030 1225" role="img" aria-labelledby="title desc">
<title id="title">05 / Offline example - saved data and a local proposal</title><desc id="desc">Original static wireframe, fictional LKR examples. Numbered annotations explain proposed interaction. No production app or financial data.</desc>
<rect width="100%" height="100%" fill="#F4F7F6"/><g font-family="Arial, sans-serif"><text x="36" y="40" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">05 / Offline example - saved data and a local proposal</text><text x="36" y="66" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Fictional sample data / static design / 4 November 2026</text>
<g transform="translate(36,96)"><rect x="-1" y="-1" width="392" height="1047" rx="21" fill="none" stroke="#82978D"/><rect x="0" y="0" width="390" height="1045" rx="20" fill="#F4F7F6"/><text x="24" y="31" font-size="11" fill="#506560" font-weight="600" text-anchor="start">CLARITY / DESIGN PROPOSAL</text><text x="24" y="66" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">Overview</text><path d="M24 84h342" stroke="#82978D" stroke-opacity=".4"/><rect x="24" y="104" width="48" height="48" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="48" y="136" font-size="27" fill="#166553" font-weight="500" text-anchor="middle">‹</text><text x="195" y="135" font-size="19" fill="#182B29" font-weight="600" text-anchor="middle">November 2026</text><g opacity=".4"><rect x="318" y="104" width="48" height="48" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="342" y="136" font-size="27" fill="#506560" font-weight="500" text-anchor="middle">›</text></g><text x="24" y="179" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Based on recorded transactions</text><rect x="24" y="199" width="342" height="52" rx="12" fill="#166553"/><text x="195.0" y="232" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">+  Add Expense</text><rect x="24" y="271" width="342" height="83" rx="16" fill="#FFF3D6"/><text x="44" y="301" font-size="16" fill="#765610" font-weight="600" text-anchor="start">Showing saved data</text><text x="44" y="329" font-size="14" fill="#765610" font-weight="400" text-anchor="start">May be incomplete or out of date.</text><circle cx="353" cy="283" r="12" fill="#182B29"/><text x="353" y="287" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><rect x="24" y="374" width="342" height="232" rx="16" fill="#FFFFFF"/><text x="44" y="404" font-size="17" fill="#182B29" font-weight="600" text-anchor="start">Recorded cash surplus</text><text x="44" y="451" font-size="32" fill="#182B29" font-weight="650" text-anchor="start">LKR 75,000.00</text><text x="44" y="478" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Income minus expenses.</text><text x="44" y="498" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Not a bank balance or automatic savings.</text><path d="M44 519h302" stroke="#82978D" stroke-opacity=".4"/><text x="44" y="550" font-size="15" fill="#506560" font-weight="400" text-anchor="start">Ordinary income</text><text x="346" y="550" font-size="16" fill="#182B29" font-weight="600" text-anchor="end">120,000.00</text><text x="44" y="582" font-size="15" fill="#506560" font-weight="400" text-anchor="start">Recorded expenses</text><text x="346" y="582" font-size="16" fill="#182B29" font-weight="600" text-anchor="end">45,000.00</text><rect x="24" y="629" width="342" height="232" rx="16" fill="#FFF3D6"/><text x="44" y="664" font-size="16" fill="#765610" font-weight="600" text-anchor="start">1 expense waiting for confirmation</text><text x="44" y="703" font-size="21" fill="#182B29" font-weight="600" text-anchor="start">Team lunch  /  LKR 750.00</text><text x="44" y="736" font-size="14" fill="#765610" font-weight="400" text-anchor="start">Saved on this device. Not in totals yet.</text><text x="44" y="759" font-size="14" fill="#765610" font-weight="400" text-anchor="start">Confirmation is checked while the app runs.</text><text x="44" y="782" font-size="14" fill="#765610" font-weight="400" text-anchor="start">Reopen Clarity to resume after it is closed.</text><rect x="44" y="797" width="302" height="52" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="195.0" y="830" font-size="16" fill="#166553" font-weight="600" text-anchor="middle">Review saved expense</text><circle cx="353" cy="642" r="12" fill="#182B29"/><text x="353" y="646" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="24" y="900" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Other sections remain available below.</text><text x="24" y="923" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Unknown outcomes are not labelled rejected.</text><rect x="0" y="969" width="390" height="76" rx="0" fill="#FFFFFF"/><path d="M0 969h390" stroke="#82978D" stroke-opacity=".4"/><rect x="22.75" y="976" width="52" height="28" rx="14" fill="#E3F1EA"/><path d="M40.75 993l8-7 8 7v8h-6v-7h-4v7h-6z" fill="none" stroke="#166553" stroke-width="1.7"/><text x="48.75" y="1026" font-size="14" fill="#166553" font-weight="600" text-anchor="middle">Overview</text><path d="M138.25 988h16m-16 6h16m-16 6h16" stroke="#506560" stroke-width="1.7"/><text x="146.25" y="1026" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">History</text><rect x="234.75" y="987" width="18" height="16" rx="2" fill="none" stroke="#506560" stroke-width="1.7"/><path d="M234.75 992h18m-13-8v6m8-6v6" stroke="#506560" stroke-width="1.7"/><text x="243.75" y="1026" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">Plans</text><circle cx="335.25" cy="994" r="2" fill="#506560"/><circle cx="341.25" cy="994" r="2" fill="#506560"/><circle cx="347.25" cy="994" r="2" fill="#506560"/><text x="341.25" y="1026" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">More</text></g>
<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Cache is not proof of connectivity</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">This example is offline, but the UI says what it knows.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">isFromCache alone must not produce an Offline claim.</text><text x="540" y="232" font-size="16" fill="#506560" font-weight="400" text-anchor="start">An uncached section says Unavailable, never zero.</text><circle cx="512" cy="289" r="12" fill="#182B29"/><text x="512" y="293" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="295" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Pending is outside confirmed totals</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Confirmed expenses stay 45,000, surplus 75,000.</text><text x="540" y="348" font-size="16" fill="#506560" font-weight="400" text-anchor="start">The 750 proposal is visible separately.</text><text x="540" y="372" font-size="16" fill="#506560" font-weight="400" text-anchor="start">After matching acknowledgement it clears;</text><text x="540" y="396" font-size="16" fill="#506560" font-weight="400" text-anchor="start">expenses become 45,750 and surplus 74,250.</text><circle cx="512" cy="453" r="12" fill="#182B29"/><text x="512" y="457" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="459" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Keep recovery eligibility unchanged</text><text x="540" y="488" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Review opens the existing saved-change state.</text><text x="540" y="512" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Unknown outcomes cannot be freely discarded.</text><text x="540" y="536" font-size="16" fill="#506560" font-weight="400" text-anchor="start">No promise of syncing while force-stopped.</text><text x="36" y="1197" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
</g></svg>