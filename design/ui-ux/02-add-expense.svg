<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1200" viewBox="0 0 1030 1200" role="img" aria-labelledby="title desc">
<title id="title">02 / Add Expense - reviewed example</title><desc id="desc">Original static wireframe, fictional LKR examples. Numbered annotations explain proposed interaction. No production app or financial data.</desc>
<rect width="100%" height="100%" fill="#F4F7F6"/><g font-family="Arial, sans-serif"><text x="36" y="40" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">02 / Add Expense - reviewed example</text><text x="36" y="66" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Fictional sample data / static design / 4 November 2026</text>
<g transform="translate(36,96)"><rect x="-1" y="-1" width="392" height="1022" rx="21" fill="none" stroke="#82978D"/><rect x="0" y="0" width="390" height="1020" rx="20" fill="#F4F7F6"/><text x="24" y="31" font-size="11" fill="#506560" font-weight="600" text-anchor="start">CLARITY / DESIGN PROPOSAL</text><text x="24" y="66" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">Back  /  Add Expense</text><path d="M24 84h342" stroke="#82978D" stroke-opacity=".4"/><text x="24" y="122" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Amount in LKR</text><rect x="24" y="138" width="342" height="78" rx="12" fill="#FFFFFF" stroke="#166553"/><text x="44" y="191" font-size="36" fill="#182B29" font-weight="600" text-anchor="start">750.00</text><circle cx="353" cy="140" r="12" fill="#182B29"/><text x="353" y="144" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="24" y="251" font-size="14" fill="#506560" font-weight="600" text-anchor="start">Payment date</text><rect x="24" y="263" width="342" height="54" rx="10" fill="#FFFFFF" stroke="#82978D"/><text x="40" y="297" font-size="17" fill="#182B29" font-weight="400" text-anchor="start">4 Nov 2026  /  Today</text><text x="24" y="339" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Asia/Colombo. Backdating is allowed.</text><circle cx="353" cy="267" r="12" fill="#182B29"/><text x="353" y="271" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="24" y="368" font-size="14" fill="#506560" font-weight="600" text-anchor="start">Category</text><rect x="24" y="380" width="342" height="54" rx="10" fill="#FFFFFF" stroke="#82978D"/><text x="40" y="414" font-size="17" fill="#182B29" font-weight="400" text-anchor="start">Food &amp; dining   /   Change</text><text x="24" y="476" font-size="14" fill="#506560" font-weight="600" text-anchor="start">Spending type</text><rect x="24" y="490" width="164" height="52" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="106" y="522" font-size="15" fill="#182B29" font-weight="400" text-anchor="middle">Committed</text><rect x="200" y="490" width="166" height="52" rx="12" fill="#E3F1EA" stroke="#166553"/><text x="283" y="522" font-size="14" fill="#166553" font-weight="600" text-anchor="middle">Selected: discretionary</text><text x="24" y="579" font-size="14" fill="#506560" font-weight="600" text-anchor="start">Payment channel</text><rect x="24" y="591" width="342" height="54" rx="10" fill="#FFFFFF" stroke="#82978D"/><text x="40" y="625" font-size="17" fill="#182B29" font-weight="400" text-anchor="start">Cash   /   Change</text><text x="24" y="685" font-size="14" fill="#506560" font-weight="600" text-anchor="start">Note (optional, up to 500 characters)</text><rect x="24" y="697" width="342" height="54" rx="10" fill="#FFFFFF" stroke="#82978D"/><text x="40" y="731" font-size="17" fill="#182B29" font-weight="400" text-anchor="start">Team lunch</text><text x="24" y="802" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Save stores your entry on this device first.</text><text x="24" y="824" font-size="14" fill="#506560" font-weight="400" text-anchor="start">It enters confirmed totals after server confirmation.</text><rect x="24" y="868" width="342" height="52" rx="12" fill="#166553"/><text x="195.0" y="901" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save Expense</text><rect x="24" y="932" width="342" height="52" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="195.0" y="965" font-size="16" fill="#166553" font-weight="600" text-anchor="middle">Cancel</text><circle cx="353" cy="882" r="12" fill="#182B29"/><text x="353" y="886" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text></g>
<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Amount first, no invented defaults</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A new form opens with a blank amount.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">This filled specimen illustrates a user choice.</text><text x="540" y="232" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Reuse exact parsing; no in-view money calculations.</text><circle cx="512" cy="289" r="12" fill="#182B29"/><text x="512" y="293" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="295" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Friendly dates, exact meaning</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Default to today, even from an older report month.</text><text x="540" y="348" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Offer a labelled date picker and manual entry.</text><text x="540" y="372" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Existing real-date/nonfuture validation stays.</text><circle cx="512" cy="429" r="12" fill="#182B29"/><text x="512" y="433" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="435" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">A focused, scrollable form</text><text x="540" y="464" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Required classifications remain visible.</text><text x="540" y="488" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Save sits above the keyboard or scrolls into view.</text><text x="540" y="512" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Disable repeated submission during local saving.</text><text x="540" y="536" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Return only after durable local acceptance.</text><text x="36" y="1172" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
</g></svg>