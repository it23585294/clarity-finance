<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Inspect before changing</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Use the existing confirmed record and edit flow.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">This is a presentation proposal, not a new data layer.</text><text x="540" y="232" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Do not allow this badge for local-only proposals.</text><circle cx="512" cy="289" r="12" fill="#182B29"/><text x="512" y="293" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="295" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Corrections retain protections</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Edit/backdate uses the existing version checks.</text><text x="540" y="348" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Delete asks Keep / Delete, with amount and date.</text><text x="540" y="372" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A linked income receipt opens its project instead.</text><text x="540" y="396" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A recurring expense keeps its consumed history.</text><text x="36" y="1172" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
