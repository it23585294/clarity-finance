<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1280" viewBox="0 0 1030 1280" role="img" aria-labelledby="title desc">
<title id="title">01 / Overview</title><desc id="desc">Original static wireframe, fictional LKR examples. Numbered annotations explain proposed interaction. No production app or financial data.</desc>
<rect width="100%" height="100%" fill="#F4F7F6"/><g font-family="Arial, sans-serif"><text x="36" y="40" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">01 / Overview</text><text x="36" y="66" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Fictional sample data / static design / 4 November 2026</text>
<g transform="translate(36,96)"><rect x="-1" y="-1" width="392" height="1102" rx="21" fill="none" stroke="#82978D"/><rect x="0" y="0" width="390" height="1100" rx="20" fill="#F4F7F6"/><text x="24" y="31" font-size="11" fill="#506560" font-weight="600" text-anchor="start">CLARITY / DESIGN PROPOSAL</text><text x="24" y="66" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">Overview</text><path d="M24 84h342" stroke="#82978D" stroke-opacity=".4"/><rect x="24" y="104" width="48" height="48" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="48" y="136" font-size="27" fill="#166553" font-weight="500" text-anchor="middle">‹</text><text x="195" y="135" font-size="19" fill="#182B29" font-weight="600" text-anchor="middle">November 2026</text><g opacity=".4"><rect x="318" y="104" width="48" height="48" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="342" y="136" font-size="27" fill="#506560" font-weight="500" text-anchor="middle">›</text></g><text x="24" y="179" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Based on recorded transactions</text><rect x="24" y="199" width="342" height="52" rx="12" fill="#166553"/><text x="195.0" y="232" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">+  Add Expense</text><circle cx="353" cy="201" r="12" fill="#182B29"/><text x="353" y="205" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><rect x="24" y="271" width="342" height="232" rx="16" fill="#FFFFFF"/><text x="44" y="301" font-size="17" fill="#182B29" font-weight="600" text-anchor="start">Recorded cash surplus</text><text x="44" y="348" font-size="32" fill="#182B29" font-weight="650" text-anchor="start">LKR 75,000.00</text><text x="44" y="375" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Income minus expenses.</text><text x="44" y="395" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Not a bank balance or automatic savings.</text><path d="M44 416h302" stroke="#82978D" stroke-opacity=".4"/><text x="44" y="447" font-size="15" fill="#506560" font-weight="400" text-anchor="start">Ordinary income</text><text x="346" y="447" font-size="16" fill="#182B29" font-weight="600" text-anchor="end">120,000.00</text><text x="44" y="479" font-size="15" fill="#506560" font-weight="400" text-anchor="start">Recorded expenses</text><text x="346" y="479" font-size="16" fill="#182B29" font-weight="600" text-anchor="end">45,000.00</text><circle cx="353" cy="286" r="12" fill="#182B29"/><text x="353" y="290" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="24" y="538" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Separate from cash surplus</text><rect x="24" y="557" width="342" height="102" rx="16" fill="#FFFFFF"/><text x="44" y="588" font-size="16" fill="#182B29" font-weight="400" text-anchor="start">Realised crypto net</text><text x="44" y="625" font-size="22" fill="#A83732" font-weight="600" text-anchor="start">Loss  /  LKR -2,500.00</text><text x="346" y="588" font-size="14" fill="#166553" font-weight="600" text-anchor="end">View</text><rect x="24" y="675" width="342" height="132" rx="16" fill="#FFFFFF"/><text x="44" y="707" font-size="17" fill="#182B29" font-weight="600" text-anchor="start">Collectible pending income</text><text x="44" y="742" font-size="21" fill="#182B29" font-weight="600" text-anchor="start">LKR 20,000.00</text><text x="44" y="773" font-size="21" fill="#182B29" font-weight="600" text-anchor="start">USD 150.00</text><circle cx="353" cy="691" r="12" fill="#182B29"/><text x="353" y="695" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="24" y="831" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Current balances, not month-end balances.</text><text x="24" y="851" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Original currencies; cancelled projects excluded.</text><rect x="24" y="884" width="342" height="122" rx="16" fill="#FFFFFF"/><text x="44" y="916" font-size="17" fill="#182B29" font-weight="600" text-anchor="start">Savings Goal  /  Laptop</text><text x="44" y="948" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">LKR 21,200.00 of 490,000.00</text><text x="44" y="979" font-size="13" fill="#506560" font-weight="400" text-anchor="start">Recorded allocations, independent of this month.</text><rect x="0" y="1024" width="390" height="76" rx="0" fill="#FFFFFF"/><path d="M0 1024h390" stroke="#82978D" stroke-opacity=".4"/><rect x="22.75" y="1031" width="52" height="28" rx="14" fill="#E3F1EA"/><path d="M40.75 1048l8-7 8 7v8h-6v-7h-4v7h-6z" fill="none" stroke="#166553" stroke-width="1.7"/><text x="48.75" y="1081" font-size="14" fill="#166553" font-weight="600" text-anchor="middle">Overview</text><path d="M138.25 1043h16m-16 6h16m-16 6h16" stroke="#506560" stroke-width="1.7"/><text x="146.25" y="1081" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">History</text><rect x="234.75" y="1042" width="18" height="16" rx="2" fill="none" stroke="#506560" stroke-width="1.7"/><path d="M234.75 1047h18m-13-8v6m8-6v6" stroke="#506560" stroke-width="1.7"/><text x="243.75" y="1081" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">Plans</text><circle cx="335.25" cy="1049" r="2" fill="#506560"/><circle cx="341.25" cy="1049" r="2" fill="#506560"/><circle cx="347.25" cy="1049" r="2" fill="#506560"/><text x="341.25" y="1081" font-size="14" fill="#506560" font-weight="400" text-anchor="middle">More</text><circle cx="353" cy="1029" r="12" fill="#182B29"/><text x="353" y="1033" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text></g>
<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Capture is the first action</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">One tap from the authenticated landing view.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">No launcher page before the dashboard.</text><circle cx="512" cy="265" r="12" fill="#182B29"/><text x="512" y="269" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="271" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">A clear monthly cash story</text><text x="540" y="300" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Surplus, received income and expenses stay together.</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Date comes from the transaction, not upload time.</text><text x="540" y="348" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A missing input makes surplus unavailable.</text><circle cx="512" cy="405" r="12" fill="#182B29"/><text x="512" y="409" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="411" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Keep other measures distinct</text><text x="540" y="440" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Crypto never becomes daily cash.</text><text x="540" y="464" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Pending currencies are never added together.</text><text x="540" y="488" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Each card opens the existing feature.</text><circle cx="512" cy="545" r="12" fill="#182B29"/><text x="512" y="549" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="540" y="551" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Stable top-level destinations</text><text x="540" y="580" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Overview / History / Plans / More.</text><text x="540" y="604" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Goal and pending cards also offer direct access.</text><text x="540" y="628" font-size="16" fill="#506560" font-weight="400" text-anchor="start">This long capture shows below-the-fold content.</text><text x="36" y="1252" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
</g></svg>