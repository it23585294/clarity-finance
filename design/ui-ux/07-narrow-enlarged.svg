<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1582" viewBox="0 0 1030 1582" role="img" aria-labelledby="title desc">
<title id="title">07 / 320 dp - enlarged-text layout study</title><desc id="desc">Original static wireframe, fictional LKR examples. Numbered annotations explain proposed interaction. No production app or financial data.</desc>
<rect width="100%" height="100%" fill="#F4F7F6"/><g font-family="Arial, sans-serif"><text x="36" y="40" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">07 / 320 dp - enlarged-text layout study</text><text x="36" y="66" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Fictional sample data / static design / 4 November 2026</text>
<g transform="translate(36,96)"><rect x="-1" y="-1" width="322" height="1404" rx="21" fill="none" stroke="#82978D"/><rect x="0" y="0" width="320" height="1402" rx="20" fill="#F4F7F6"/><text x="24" y="31" font-size="11" fill="#506560" font-weight="600" text-anchor="start">CLARITY / DESIGN PROPOSAL</text><text x="24" y="66" font-size="24" fill="#182B29" font-weight="600" text-anchor="start">Back  /  Add Expense</text><path d="M24 84h272" stroke="#82978D" stroke-opacity=".4"/><text x="16" y="123" font-size="20" fill="#506560" font-weight="400" text-anchor="start">Amount in LKR</text><rect x="16" y="142" width="288" height="84" rx="12" fill="#FFFFFF" stroke="#166553"/><text x="32" y="198" font-size="40" fill="#182B29" font-weight="600" text-anchor="start">750.00</text><text x="16" y="270" font-size="20" fill="#506560" font-weight="600" text-anchor="start">Payment date</text><rect x="16" y="288" width="288" height="68" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="32" y="330" font-size="24" fill="#182B29" font-weight="400" text-anchor="start">4 Nov 2026</text><text x="16" y="390" font-size="20" fill="#506560" font-weight="400" text-anchor="start">Asia/Colombo.</text><text x="16" y="420" font-size="20" fill="#506560" font-weight="400" text-anchor="start">Backdating is allowed.</text><text x="16" y="486" font-size="20" fill="#506560" font-weight="600" text-anchor="start">Category</text><rect x="16" y="506" width="288" height="70" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="32" y="549" font-size="24" fill="#182B29" font-weight="400" text-anchor="start">Food &amp; dining</text><text x="16" y="634" font-size="20" fill="#506560" font-weight="600" text-anchor="start">Spending type</text><rect x="16" y="655" width="288" height="68" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="32" y="697" font-size="22" fill="#182B29" font-weight="400" text-anchor="start">Committed</text><rect x="16" y="735" width="288" height="68" rx="12" fill="#E3F1EA" stroke="#166553"/><text x="32" y="777" font-size="22" fill="#166553" font-weight="600" text-anchor="start">Selected: discretionary</text><text x="16" y="862" font-size="20" fill="#506560" font-weight="600" text-anchor="start">Payment channel</text><rect x="16" y="882" width="288" height="70" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="32" y="925" font-size="24" fill="#182B29" font-weight="400" text-anchor="start">Cash</text><text x="16" y="1006" font-size="20" fill="#506560" font-weight="600" text-anchor="start">Note (optional)</text><rect x="16" y="1026" width="288" height="84" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="32" y="1070" font-size="24" fill="#182B29" font-weight="400" text-anchor="start">Team lunch</text><text x="16" y="1168" font-size="20" fill="#506560" font-weight="400" text-anchor="start">Saved on this device first.</text><text x="16" y="1198" font-size="20" fill="#506560" font-weight="400" text-anchor="start">Not in confirmed totals yet.</text><rect x="16" y="1242" width="288" height="52" rx="12" fill="#166553"/><text x="160.0" y="1275" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save Expense</text><rect x="16" y="1310" width="288" height="52" rx="12" fill="#FFFFFF" stroke="#82978D"/><text x="160.0" y="1343" font-size="16" fill="#166553" font-weight="600" text-anchor="middle">Cancel</text></g>
<circle cx="512" cy="149" r="12" fill="#182B29"/><text x="512" y="153" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="155" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Stack rather than shrink</text><text x="540" y="184" font-size="16" fill="#506560" font-weight="400" text-anchor="start">16 dp sides; full-width labelled controls.</text><text x="540" y="208" font-size="16" fill="#506560" font-weight="400" text-anchor="start">This is a 1.3x-ish typography study, not a runtime test.</text><text x="540" y="232" font-size="16" fill="#506560" font-weight="400" text-anchor="start">A 2.0x layout is still an implementation gate.</text><circle cx="512" cy="289" r="12" fill="#182B29"/><text x="512" y="293" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="295" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Keyboard and focus contract</text><text x="540" y="324" font-size="16" fill="#506560" font-weight="400" text-anchor="start">The whole content scrolls above IME insets.</text><text x="540" y="348" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Focus follows amount, date and classifications.</text><text x="540" y="372" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Save and Cancel remain reachable while typing.</text><text x="540" y="396" font-size="16" fill="#506560" font-weight="400" text-anchor="start">No fixed full-form height in implementation.</text><circle cx="512" cy="453" r="12" fill="#182B29"/><text x="512" y="457" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="459" font-size="18" fill="#182B29" font-weight="600" text-anchor="start">Design review limits</text><text x="540" y="488" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Static art cannot verify TalkBack or touch targets.</text><text x="540" y="512" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Measure semantics and 48 dp target bounds later.</text><text x="540" y="536" font-size="16" fill="#506560" font-weight="400" text-anchor="start">Test API 26 and a stable newer isolated device.</text><text x="36" y="1554" font-size="14" fill="#506560" font-weight="400" text-anchor="start">Scroll-capture composition, not a fixed-height implementation. Review at 100% for text size.</text>
</g></svg>